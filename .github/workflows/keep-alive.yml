name: Keep-alive (Supabase)

on:
  # A cada 3 dias, às 09:00 de Brasília (o plano gratuito pausa após 7 dias sem uso).
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Consulta leve com a anon key; o RLS devolve lista vazia, mas o projeto registra a atividade.
      - name: Consultar a API do Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Só o header apikey: funciona com a anon key antiga e com a nova publishable key.
          curl -fsS -o /dev/null "${SUPABASE_URL}/rest/v1/groups?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}"
          echo "Projeto Supabase respondeu com sucesso."
