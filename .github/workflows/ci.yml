name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Uma execução por branch/PR; a anterior é cancelada se houver um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      # Variáveis falsas: o build só precisa compilar, sem falar com o Supabase.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

      # Só executa se existir um script "test" no package.json.
      - name: Testes
        run: npm test --if-present
